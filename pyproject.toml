[project]
name = "tank-twin"
version = "0.0.0"
description = "Python RL driver for the Tank Twin Stick Shooter revival (self-play PPO over TCP-JSON)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# numpy underpins the M0 pure-logic modules (state-flip / opponent-selection:
# dtype-exact array ops, np.random.choice). Standards allow numpy on pure-logic.
#
# M1 Wave 0 (board session 05): the RL stack lands here — torch (PPO backbone),
# stable-baselines3 (PPO + NatureCNN feature extractor), gymnasium (env API).
# These are NOT in the pure-logic import path: only the trainer / feature-extractor
# code (not yet written) imports them, so the existing pure modules + tests run
# without torch/sb3/gymnasium present. SB3 2.9 pins gymnasium<2 / torch<3 / numpy<3
# — the bounds below are compatible. torch's CUDA wheel is sourced via the cu130
# index wired below (see [tool.uv.sources] / [[tool.uv.index]]).
dependencies = [
    "numpy>=2.0,<3",
    # torch pinned to the 2.9 line: that is the version the board (session 05)
    # approved and the version against which the SB3 2.9 NatureCNN (.cnn / .linear)
    # pretrained-load contract was validated. The literal `>=2.9,<3` bound the task
    # named would let the resolver float to the latest (2.12.x); we hold the minor
    # so the locked artifact matches what was reviewed. Widen deliberately later.
    "torch>=2.9,<2.10",
    "stable-baselines3>=2.9,<3",
    "gymnasium>=1.3,<2",
    # Training-metrics observability (CTO-approved, board): SB3 logger writes
    # progress.csv + tfevents; plot_metrics renders the CSV to a PNG dashboard.
    # NOT in the pure-logic import path — matplotlib is imported only inside
    # tank_twin.plot_metrics, and tensorboard is loaded lazily by SB3's logger.
    # Upper-bounded to the resolved minor lines (repo "pin it" etiquette).
    "matplotlib>=3.11,<3.12",
    "tensorboard>=2.20,<2.21",
    # Pillow: the pixel-capture verify (scripts/verify_pixel_capture.py) writes the
    # decoded RGB frames to PNG for the CTO's eyeball check. Already present transitively
    # (via matplotlib) and resolved at 12.2.0; pinned top-level so the verify's PNG write
    # is an explicit, declared dependency (repo "pin it" etiquette). Not in the pure-logic
    # / env / trainer import path — only the verify script imports PIL.
    "pillow>=12.2,<13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tank_twin"]

# --- torch CUDA wheel sourcing (the one fiddly step; see engineering-standards) ---
# Local dev box: Windows + NVIDIA RTX 3080, driver 610.62 / CUDA UMD 13.3 (CUDA 13.x).
# torch 2.9 ships cu130 cp312 win_amd64 wheels at the index below — that matches the
# installed CUDA 13.x runtime, so we source the GPU wheel from cu130 on win32.
# On other platforms (e.g. a Linux CI runner) torch resolves from the default PyPI
# index (CPU wheel), keeping the project resolvable off this box without a GPU.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true  # only used by packages that name it in [tool.uv.sources]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

# Dev tooling only. Route any new dependency to the human (slopsquatting guard).
[dependency-groups]
dev = [
    "ruff>=0.12,<0.13",
    "pytest>=8.4,<9",
]

[tool.ruff]
line-length = 100
# First-party roots for import sorting (I).
src = ["src", "tests"]
# Scope ruff to the new package + tests. Keeps unrelated tooling (boardroom/)
# and the un-migrated 2021 scripts out of BOTH the lint and format gates.
# The legacy scripts migrate in A6/A7; the per-file-ignores below are staged
# for that (ruff format ignores per-file-ignores, so excluding the dir is the
# only way to keep `ruff format --check` green until those files are ported).
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]
extend-exclude = ["PythonScripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert-heavy / fixture patterns; relax bugbear-style nags.
"tests/**" = ["B", "SIM"]
# Legacy 2021 scripts are NOT migrated yet — exempt them entirely until A6/A7.
"PythonScripts/*.py" = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a live Unity build or socket (opt-in; deselect with -m 'not integration')",
    "e2e: end-to-end pipeline tests that import torch/sb3 (no Unity; run with -m e2e, skip with -m 'not e2e')",
]
